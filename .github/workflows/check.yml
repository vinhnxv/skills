name: check

on:
  push:
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Host copies stay in parity
        run: sh scripts/check-parity.sh

      - name: The parity check can still fail
        run: sh scripts/test-check-parity.sh

      # Parity compares a skill against its own other host copy, so it cannot
      # express an invariant that spans two DIFFERENT skills. This is the only
      # check that can.
      - name: Cross-skill invariants hold
        run: sh scripts/check-cross-skill.sh

      # Supplementary gate only, and a partial one: probed against this
      # skill, `claude plugin validate --strict` catches a missing
      # `description` and a missing or empty frontmatter block, but passes a
      # SKILL.md with no `name:`, with a name that does not match its
      # directory, or with malformed frontmatter YAML. check-parity.sh covers
      # those and is the gate that always runs -- `claude` is absent from a
      # stock runner, so this step usually skips.
      #
      # The validator only scans one level below a directory literally named
      # `skills`. Pointed at this repository's own skills/ it would find
      # claude/ and codex/, validate nothing, and report success -- so each
      # host tree is staged into its own temporary skills/ first.
      - name: Validate each host tree against Claude Code
        run: |
          if ! command -v claude >/dev/null 2>&1; then
            echo "::notice::claude is not on PATH; skipping plugin validate"
            exit 0
          fi
          status=0
          for host in claude codex; do
            tmp=$(mktemp -d)
            mkdir -p "$tmp/skills"
            cp -R "skills/$host/." "$tmp/skills/"
            echo "Validating skills/$host staged at $tmp/skills"
            claude plugin validate "$tmp/skills" --strict || status=1
            # Removed on both paths: a failing host must not leave its staged
            # tree behind, and both hosts get validated before the job exits so
            # one run reports every failure rather than only the first.
            rm -rf "$tmp"
          done
          exit "$status"

  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # `--contract-only` is load-bearing: the other half of that suite drives
      # a model through the host CLI, which is slow, non-deterministic, and has
      # no place on a push path. The contract half is pure shell and pins the
      # `bd` behaviours BOTH skills are built on -- which flags hide rows, what
      # a native gate looks like, that a human gate is offered as ready work,
      # that `--readonly` refuses a write, and that `bd export` rather than a
      # file diff is the non-mutation oracle, plus the write-protocol behaviours
      # `repo-audit` rests on: the empty-description asymmetry, the one-call
      # gate form, exact metadata-value matching, and a deferred issue staying
      # findable while it leaves the ready listing.
      #
      # `bd` is absent from a stock runner, so on this repository's own CI this
      # step SKIPS and proves nothing -- the step name says so, because a green
      # check named as an assertion is exactly the silent pass this whole
      # feature exists to stop. It earns its place anyway: the day someone runs
      # it on a runner with `bd` installed, a tracker change that invalidated
      # the procedure fails here instead of inside an unattended loop that has
      # already claimed a batch. Install `bd` on the runner to turn it on.
      - name: Tracker contract for both skills (skipped unless bd is installed)
        run: sh scripts/test-census.sh --contract-only

  install:
    # The README's install command is the first thing a stranger runs, and it
    # is the one piece of this repository that executes on their machine, not
    # ours. `--strip-components` and member selection behave the same on GNU
    # tar and bsdtar in principle; this proves it on both rather than assuming.
    # A `git archive --prefix=skills-main/` stand-in reproduces exactly what
    # GitHub serves for the main branch, so the check needs no network and no
    # published commit.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: The documented install command works on this platform
        run: |
          set -eu
          tar --version | head -1
          git archive --format=tar.gz --prefix=skills-main/ HEAD > "$RUNNER_TEMP/main.tar.gz"
          home="$RUNNER_TEMP/fakehome"
          rm -rf "$home"; mkdir -p "$home"

          # Every skill, not one named here: a skill this job does not extract
          # is a skill whose install command nobody has ever run.
          for skill in $(ls skills/claude); do
            # Verbatim from README.md, with the archive standing in for the
            # curl and the skill name substituted.
            HOME="$home" sh -c "mkdir -p ~/.claude/skills && tar -xz -C ~/.claude/skills --strip-components=3 skills-main/skills/claude/$skill" < "$RUNNER_TEMP/main.tar.gz"
            HOME="$home" sh -c "mkdir -p ~/.codex/skills  && tar -xz -C ~/.codex/skills  --strip-components=3 skills-main/skills/codex/$skill"  < "$RUNNER_TEMP/main.tar.gz"

            diff -r "$home/.claude/skills/$skill" "skills/claude/$skill"
            diff -r "$home/.codex/skills/$skill"  "skills/codex/$skill"
            echo "install produced byte-identical trees for both hosts: $skill"
          done

      # A skill nobody can find the command for is not installable, however
      # cleanly it extracts. Checked against the archive member path both
      # one-liners carry, which is the part that must name the skill exactly.
      - name: The README documents an install command for every skill
        run: |
          set -eu
          status=0
          for skill in $(ls skills/claude); do
            for host in claude codex; do
              if ! grep -qF "skills-main/skills/$host/$skill" README.md; then
                echo "README.md documents no $host install command for '$skill'"
                status=1
              fi
            done
          done
          [ "$status" -eq 0 ] || exit 1
          echo "every skill has an install command for both hosts in README.md"

      # Deliberately one literal skill: this is a negative control on tar's
      # behaviour, not on the skill set, and looping it would prove the same
      # thing once per skill.
      - name: A missing target directory fails loudly instead of mis-installing
        run: |
          set -eu
          git archive --format=tar.gz --prefix=skills-main/ HEAD > "$RUNNER_TEMP/main.tar.gz"
          status=0
          tar -xzf "$RUNNER_TEMP/main.tar.gz" -C "$RUNNER_TEMP/absent" \
              --strip-components=3 skills-main/skills/claude/backlog-loop 2>/dev/null || status=$?
          [ "$status" -ne 0 ] || { echo "tar silently accepted a missing -C directory"; exit 1; }
          echo "tar into a missing directory exits $status, as the README states"

